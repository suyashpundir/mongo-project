version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: netpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--setParameter", "ttlMonitorSleepSecs=60"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=netpulse
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMBEDDING_MODEL=text-embedding-004
      - SYNTHESIS_MODEL=gemini-2.5-flash
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  chaos-simulator:
    build:
      context: ./chaos-simulator
      dockerfile: Dockerfile
    container_name: netpulse-chaos-simulator
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
